name: Mobile Release

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instead-mobile-release
  cancel-in-progress: false

jobs:
  android:
    name: Android internal testing
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Generate production configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          npm run env:generate

      - name: Prepare Android signing
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64"
          keystore="$RUNNER_TEMP/instead-upload.keystore"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "INSTEAD_UPLOAD_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build signed Android App Bundle
        working-directory: android
        env:
          INSTEAD_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          INSTEAD_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          INSTEAD_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          INSTEAD_VERSION_NAME: ${{ vars.APP_VERSION }}
        run: |
          set -euo pipefail
          test -n "$INSTEAD_UPLOAD_STORE_PASSWORD"
          test -n "$INSTEAD_UPLOAD_KEY_ALIAS"
          test -n "$INSTEAD_UPLOAD_KEY_PASSWORD"
          test -n "$INSTEAD_VERSION_NAME"
          export INSTEAD_VERSION_CODE=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          ./gradlew bundleRelease --build-cache --no-daemon --stacktrace --console=plain

      - name: Preserve Android artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instead-android-${{ github.run_number }}-${{ github.run_attempt }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Google Play Internal Testing
        env:
          ANDROID_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_PACKAGE_NAME: ${{ vars.ANDROID_PLAY_PACKAGE_NAME }}
          GOOGLE_PLAY_TRACK: ${{ vars.ANDROID_PLAY_TRACK }}
          GOOGLE_PLAY_RELEASE_STATUS: ${{ vars.ANDROID_PLAY_RELEASE_STATUS }}
          GOOGLE_PLAY_RELEASE_NAME: INSTEAD ${{ vars.APP_VERSION }} (${{ github.run_number }}.${{ github.run_attempt }})
        run: |
          set -euo pipefail
          test -n "$ANDROID_PLAY_SERVICE_ACCOUNT_JSON"
          test -n "$GOOGLE_PLAY_PACKAGE_NAME"
          test -n "$GOOGLE_PLAY_TRACK"
          credentials="$RUNNER_TEMP/google-play-service-account.json"
          bundle="android/app/build/outputs/bundle/release/app-release.aab"
          printf '%s' "$ANDROID_PLAY_SERVICE_ACCOUNT_JSON" > "$credentials"
          chmod 600 "$credentials"
          GOOGLE_APPLICATION_CREDENTIALS="$credentials" \
            GOOGLE_PLAY_BUNDLE_PATH="$bundle" \
            node scripts/upload-google-play.mjs

  ios:
    name: iOS TestFlight
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    timeout-minutes: 60
    environment: production

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate production configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          npm run env:generate

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Install iOS signing material
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_PROFILE_NAME_EXPECTED: ${{ vars.IOS_PROFILE_NAME }}
        run: |
          set -euo pipefail
          test -n "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64"
          test -n "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD"
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"
          test -n "$IOS_TEAM_ID"
          test -n "$IOS_PROFILE_NAME_EXPECTED"

          certificate="$RUNNER_TEMP/instead-distribution.p12"
          profile="$RUNNER_TEMP/instead.mobileprovision"
          profile_plist="$RUNNER_TEMP/instead-profile.plist"
          keychain="$RUNNER_TEMP/instead-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$certificate"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 -D > "$profile"
          security cms -D -i "$profile" > "$profile_plist"

          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")
          application_identifier=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")
          profile_team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")

          test "$application_identifier" = "${IOS_TEAM_ID}.com.pamisu.instead"
          test "$profile_team" = "$IOS_TEAM_ID"
          test "$profile_name" = "$IOS_PROFILE_NAME_EXPECTED"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          installed_profile="$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
          cp "$profile" "$installed_profile"

          echo "IOS_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_PATH=$installed_profile" >> "$GITHUB_ENV"
          echo "IOS_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Archive and export iOS app
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_MARKETING_VERSION: ${{ vars.APP_VERSION }}
        run: |
          set -euo pipefail
          test -n "$IOS_TEAM_ID"
          test -n "$IOS_MARKETING_VERSION"
          test -n "$IOS_PROFILE_NAME"

          build_number=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          archive="$RUNNER_TEMP/Instead.xcarchive"
          export_path="$RUNNER_TEMP/instead-export"
          export_options="$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild \
            -workspace ios/Instead.xcworkspace \
            -scheme Instead \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$build_number" \
            MARKETING_VERSION="$IOS_MARKETING_VERSION" \
            archive

          cat > "$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>provisioningProfiles</key><dict>
              <key>com.pamisu.instead</key><string>${IOS_PROFILE_NAME}</string>
            </dict>
          </dict></plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$archive" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options"

          mkdir -p ios/build/ios
          cp "$export_path"/*.ipa ios/build/ios/

      - name: Preserve iOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instead-ios-${{ github.run_number }}-${{ github.run_attempt }}
          path: ios/build/ios/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_API_KEY_ID"
          test -n "$APP_STORE_CONNECT_API_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64"
          key_dir="$HOME/.appstoreconnect/private_keys"
          private_key="$key_dir/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          mkdir -p "$key_dir"
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64" | /usr/bin/base64 -D > "$private_key"
          chmod 600 "$private_key"
          xcrun altool \
            --upload-app \
            --type ios \
            --file ios/build/ios/*.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Remove temporary iOS credentials
        if: always()
        run: |
          if [[ -n "${IOS_SIGNING_KEYCHAIN:-}" && -f "$IOS_SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$IOS_SIGNING_KEYCHAIN" || true
          fi
          if [[ -n "${IOS_PROFILE_PATH:-}" ]]; then
            rm -f "$IOS_PROFILE_PATH"
          fi
          if [[ -n "${APP_STORE_CONNECT_API_KEY_ID:-}" ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          fi
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
