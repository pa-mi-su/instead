name: Mobile Release

on:
  workflow_call:
    inputs:
      android:
        type: boolean
        required: true
      ios:
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to release from tested main
        type: choice
        default: both
        options: [both, android, ios]
      android_track:
        description: Play destination (configured uses the production environment variable)
        type: choice
        default: configured
        options: [configured, internal, alpha, beta, production]

permissions:
  contents: read
  actions: read

concurrency:
  group: instead-mobile-release
  cancel-in-progress: false
  queue: max

jobs:
  changes:
    name: Detect mobile release changes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}

    steps:
      - name: Check out full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select mobile releases
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_CHANGED: ${{ inputs.android }}
          IOS_CHANGED: ${{ inputs.ios }}
          RELEASE_PLATFORM: ${{ inputs.platform }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            node scripts/require-release-ci.mjs
            case "$RELEASE_PLATFORM" in
              both) printf 'android=true\nios=true\n' >> "$GITHUB_OUTPUT" ;;
              android) printf 'android=true\nios=false\n' >> "$GITHUB_OUTPUT" ;;
              ios) printf 'android=false\nios=true\n' >> "$GITHUB_OUTPUT" ;;
              *) exit 1 ;;
            esac
          else
            printf 'android=%s\nios=%s\n' "$ANDROID_CHANGED" "$IOS_CHANGED" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android Google Play
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: write

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Validate Android release configuration
        env:
          GOOGLE_PLAY_TRACK: ${{ inputs.android_track != '' && inputs.android_track != 'configured' && inputs.android_track || vars.ANDROID_PLAY_TRACK }}
          GOOGLE_PLAY_RELEASE_STATUS: ${{ vars.ANDROID_PLAY_RELEASE_STATUS || 'completed' }}
          GOOGLE_PLAY_REVIEW_MODE: ${{ vars.ANDROID_PLAY_REVIEW_MODE || 'auto' }}
          GOOGLE_PLAY_USER_FRACTION: ${{ vars.ANDROID_PLAY_USER_FRACTION }}
        run: |
          node --input-type=module <<'JS'
          import { playRelease, reviewMode } from './scripts/google-play-release.mjs';
          playRelease({track: process.env.GOOGLE_PLAY_TRACK,
            status: process.env.GOOGLE_PLAY_RELEASE_STATUS,
            fraction: process.env.GOOGLE_PLAY_USER_FRACTION});
          reviewMode(process.env.GOOGLE_PLAY_REVIEW_MODE);
          JS

      - name: Reserve next build number
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_PLATFORM: android
        run: node scripts/reserve-mobile-build.mjs

      - name: Install dependencies
        run: npm ci

      - name: Generate production configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          npm run env:generate
          node scripts/check-profile-avatars.mjs

      - name: Prepare Android signing
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64"
          umask 077
          keystore="$RUNNER_TEMP/instead-upload.keystore"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "INSTEAD_UPLOAD_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build signed Android App Bundle
        working-directory: android
        env:
          INSTEAD_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          INSTEAD_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          INSTEAD_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          INSTEAD_VERSION_NAME: ${{ vars.APP_VERSION }}
        run: |
          set -euo pipefail
          test -n "$INSTEAD_UPLOAD_STORE_PASSWORD"
          test -n "$INSTEAD_UPLOAD_KEY_ALIAS"
          test -n "$INSTEAD_UPLOAD_KEY_PASSWORD"
          test -n "$INSTEAD_VERSION_NAME"
          export INSTEAD_VERSION_CODE="$INSTEAD_BUILD_NUMBER"
          ./gradlew bundleRelease --build-cache --no-daemon --stacktrace --console=plain

      - name: Preserve Android artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instead-android-${{ github.run_number }}-${{ github.run_attempt }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload to selected Google Play track
        env:
          ANDROID_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_PACKAGE_NAME: ${{ vars.ANDROID_PLAY_PACKAGE_NAME }}
          GOOGLE_PLAY_TRACK: ${{ inputs.android_track != '' && inputs.android_track != 'configured' && inputs.android_track || vars.ANDROID_PLAY_TRACK }}
          GOOGLE_PLAY_RELEASE_STATUS: ${{ vars.ANDROID_PLAY_RELEASE_STATUS || 'completed' }}
          GOOGLE_PLAY_REVIEW_MODE: ${{ vars.ANDROID_PLAY_REVIEW_MODE || 'auto' }}
          GOOGLE_PLAY_EXPECTED_VERSION_CODE: ${{ env.INSTEAD_BUILD_NUMBER }}
          GOOGLE_PLAY_USER_FRACTION: ${{ vars.ANDROID_PLAY_USER_FRACTION }}
          GOOGLE_PLAY_RELEASE_NAME: INSTEAD ${{ vars.APP_VERSION }} (${{ env.INSTEAD_BUILD_NUMBER }})
        run: |
          set -euo pipefail
          test -n "$ANDROID_PLAY_SERVICE_ACCOUNT_JSON"
          test -n "$GOOGLE_PLAY_PACKAGE_NAME"
          test -n "$GOOGLE_PLAY_TRACK"
          credentials="$RUNNER_TEMP/google-play-service-account.json"
          bundle="android/app/build/outputs/bundle/release/app-release.aab"
          printf '%s' "$ANDROID_PLAY_SERVICE_ACCOUNT_JSON" > "$credentials"
          chmod 600 "$credentials"
          GOOGLE_APPLICATION_CREDENTIALS="$credentials" \
            GOOGLE_PLAY_BUNDLE_PATH="$bundle" \
            node scripts/upload-google-play.mjs

      - name: Remove temporary Android credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/instead-upload.keystore" "$RUNNER_TEMP/google-play-service-account.json"

  ios:
    name: iOS App Store Connect
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # Only named standard hosted pools are allowed; never use an arbitrary runner label.
    runs-on: >-
      ${{ vars.IOS_RUNNER == 'macos-15' && 'macos-15' ||
          vars.IOS_RUNNER == 'macos-15-intel' && 'macos-15-intel' ||
          vars.IOS_RUNNER == 'macos-26-intel' && 'macos-26-intel' ||
          'macos-26' }}
    timeout-minutes: 60
    environment: production
    permissions:
      contents: write

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Reserve next build number
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_PLATFORM: ios
        run: node scripts/reserve-mobile-build.mjs

      - name: Install dependencies
        run: npm ci

      - name: Generate production configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          npm run env:generate
          node scripts/check-profile-avatars.mjs

      - name: Cache CocoaPods downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-${{ runner.arch }}-

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Cache device compilation
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/InsteadReleaseDerivedData/Build/Intermediates.noindex
            ${{ runner.temp }}/InsteadReleaseDerivedData/ModuleCache.noindex
            ${{ runner.temp }}/InsteadReleaseDerivedData/SDKStatCaches.noindex
          key: ios-release-v1-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('package-lock.json', 'ios/Podfile.lock', 'ios/Podfile', 'ios/Instead.xcodeproj/project.pbxproj') }}-${{ github.sha }}
          restore-keys: ios-release-v1-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('package-lock.json', 'ios/Podfile.lock', 'ios/Podfile', 'ios/Instead.xcodeproj/project.pbxproj') }}-

      - name: Install iOS signing material
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_PROFILE_NAME_EXPECTED: ${{ vars.IOS_PROFILE_NAME }}
        run: |
          set -euo pipefail
          test -n "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64"
          test -n "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD"
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"
          test -n "$IOS_TEAM_ID"
          test -n "$IOS_PROFILE_NAME_EXPECTED"

          certificate="$RUNNER_TEMP/instead-distribution.p12"
          profile="$RUNNER_TEMP/instead.mobileprovision"
          profile_plist="$RUNNER_TEMP/instead-profile.plist"
          keychain="$RUNNER_TEMP/instead-signing.keychain-db"
          keychain_password="$(uuidgen)"
          umask 077

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$certificate"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 -D > "$profile"
          security cms -D -i "$profile" > "$profile_plist"

          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")
          application_identifier=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")
          profile_team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")

          test "$application_identifier" = "${IOS_TEAM_ID}.com.pamisu.instead"
          test "$profile_team" = "$IOS_TEAM_ID"
          test "$profile_name" = "$IOS_PROFILE_NAME_EXPECTED"
          python3 scripts/validate-ios-release.py profile "$profile_plist" "$IOS_TEAM_ID" "$IOS_PROFILE_NAME_EXPECTED"

          # Record cleanup paths before importing any material, including on a partial failure.
          echo "IOS_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          installed_profile="$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
          echo "IOS_PROFILE_PATH=$installed_profile" >> "$GITHUB_ENV"
          cp "$profile" "$installed_profile"

          echo "IOS_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_PATH=$installed_profile" >> "$GITHUB_ENV"
          echo "IOS_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Archive and export iOS app
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_MARKETING_VERSION: ${{ vars.APP_VERSION }}
        run: |
          set -euo pipefail
          test -n "$IOS_TEAM_ID"
          test -n "$IOS_MARKETING_VERSION"
          test -n "$IOS_PROFILE_NAME"

          build_number="$INSTEAD_BUILD_NUMBER"
          archive="$RUNNER_TEMP/Instead.xcarchive"
          export_path="$RUNNER_TEMP/instead-export"
          export_options="$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild \
            -workspace ios/Instead.xcworkspace \
            -scheme Instead \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive" \
            -derivedDataPath "$RUNNER_TEMP/InsteadReleaseDerivedData" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$build_number" \
            MARKETING_VERSION="$IOS_MARKETING_VERSION" \
            -showBuildTimingSummary \
            archive

          python3 - "$export_options" <<'PY'
          import os, plistlib, sys
          with open(sys.argv[1], 'wb') as output:
              plistlib.dump({
                  'method': 'app-store-connect',
                  'signingStyle': 'manual',
                  'teamID': os.environ['IOS_TEAM_ID'],
                  'provisioningProfiles': {
                      'com.pamisu.instead': os.environ['IOS_PROFILE_NAME'],
                  },
              }, output)
          PY

          xcodebuild \
            -exportArchive \
            -archivePath "$archive" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options"

          python3 scripts/validate-ios-release.py ipa "$export_path" "$IOS_MARKETING_VERSION" "$build_number"
          mkdir -p ios/build/ios
          cp "$export_path"/*.ipa ios/build/ios/

      - name: Preserve iOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instead-ios-${{ github.run_number }}-${{ github.run_attempt }}
          path: ios/build/ios/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        env:
          IOS_MARKETING_VERSION: ${{ vars.APP_VERSION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_API_KEY_ID"
          test -n "$APP_STORE_CONNECT_API_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64"
          ipa=$(python3 scripts/validate-ios-release.py ipa ios/build/ios "$IOS_MARKETING_VERSION" "$INSTEAD_BUILD_NUMBER")
          key_dir="$HOME/.appstoreconnect/private_keys"
          private_key="$key_dir/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          mkdir -p "$key_dir"
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64" | /usr/bin/base64 -D > "$private_key"
          chmod 600 "$private_key"
          xcrun altool --validate-app --type ios --file "$ipa" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$ipa" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
          echo "iOS build $INSTEAD_BUILD_NUMBER uploaded. Apple processing, TestFlight availability and App Review are separate; verify App Store Connect." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary iOS credentials
        if: always()
        run: |
          if [[ -n "${IOS_SIGNING_KEYCHAIN:-}" && -f "$IOS_SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$IOS_SIGNING_KEYCHAIN" || true
          fi
          if [[ -n "${IOS_PROFILE_PATH:-}" ]]; then
            rm -f "$IOS_PROFILE_PATH"
          fi
          if [[ -n "${APP_STORE_CONNECT_API_KEY_ID:-}" ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          fi
          rm -f "$RUNNER_TEMP/instead-distribution.p12" "$RUNNER_TEMP/instead.mobileprovision" "$RUNNER_TEMP/instead-profile.plist"
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
