name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

jobs:
  changes:
    name: Detect platform changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      website: ${{ steps.filter.outputs.website }}
      quality: ${{ steps.filter.outputs.quality }}

    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select native builds
        id: filter
        env:
          DIFF_MODE: ${{ github.event_name == 'push' && 'push' || 'pull_request' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/detect-platform-changes.mjs "$BASE_SHA" "$HEAD_SHA"

  quality:
    name: Quality checks
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install native dependencies
        run: npm ci

      - name: Reject production vulnerabilities
        run: |
          node scripts/audit-native.mjs

      - name: Verify native code
        run: npm run verify

      - name: Verify account-deletion authorization
        run: npm run safety:test

      - name: Verify Supabase database policies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          INSTEAD_PG_BIN="$(pg_config --bindir)" python3 scripts/test-community-db.py

      - name: Verify pipeline routing
        run: node --test scripts/test-detect-platform-changes.mjs scripts/test-require-release-ci.mjs scripts/test-google-play-release.mjs

      - name: Verify static administration site
        if: needs.changes.outputs.website == 'true'
        run: |
          npm run website:build
          node --check website/admin/admin.mjs
          npx eslint website/admin/admin.mjs website/admin/auth-security.mjs --env browser,es2022 --parser-options '{"ecmaVersion":2022,"sourceType":"module"}'

  android:
    name: Android debug build
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build Android debug app
        working-directory: android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --build-cache --no-daemon --stacktrace --console=plain

  ios:
    name: iOS simulator build
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # Only named standard hosted pools are allowed; never use an arbitrary runner label.
    runs-on: >-
      ${{ vars.IOS_RUNNER == 'macos-15' && 'macos-15' ||
          vars.IOS_RUNNER == 'macos-15-intel' && 'macos-15-intel' ||
          vars.IOS_RUNNER == 'macos-26-intel' && 'macos-26-intel' ||
          'macos-26' }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache CocoaPods downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-${{ runner.arch }}-

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Cache simulator compilation
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/InsteadDerivedData
          key: ios-debug-v1-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('package-lock.json', 'ios/Podfile.lock', 'ios/Podfile', 'ios/Instead.xcodeproj/project.pbxproj') }}-${{ github.sha }}
          restore-keys: ios-debug-v1-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('package-lock.json', 'ios/Podfile.lock', 'ios/Podfile', 'ios/Instead.xcodeproj/project.pbxproj') }}-

      - name: Build iOS simulator app
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Instead.xcworkspace \
            -scheme Instead \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/InsteadDerivedData" \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildTimingSummary \
            build

  required:
    name: Quality and Android
    if: always()
    needs: [changes, quality, android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Require quality and every applicable mobile build
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_EXPECTED: ${{ needs.changes.outputs.quality }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          ANDROID_EXPECTED: ${{ needs.changes.outputs.android }}
          IOS_EXPECTED: ${{ needs.changes.outputs.ios }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          for platform in QUALITY ANDROID IOS; do
            expected_var="${platform}_EXPECTED"
            result_var="${platform}_RESULT"
            if [[ "${!expected_var}" == true ]]; then
              test "${!result_var}" = success
            else
              test "${!expected_var}" = false
              test "${!result_var}" = skipped
            fi
          done

  deploy-website:
    name: Deploy website and admin
    timeout-minutes: 10
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.quality.result == 'success' && needs.changes.outputs.website == 'true'
    needs: [changes, quality]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website and admin
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          npm run website:build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::160885294528:role/github-actions-instead-website-deploy
          aws-region: us-east-1

      - name: Publish site and refresh CloudFront
        run: |
          set -euo pipefail
          aws s3 sync website/dist/ s3://insteadtry-website-160885294528/ --no-cli-pager
          aws cloudfront create-invalidation \
            --distribution-id EMXS0LG36D5KE \
            --paths '/*' \
            --no-cli-pager

  mobile-release:
    name: Release changed mobile platforms
    needs: [changes, required]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.required.result == 'success' &&
      (needs.changes.outputs.android == 'true' || needs.changes.outputs.ios == 'true')
    uses: ./.github/workflows/mobile-release.yml
    with:
      android: ${{ needs.changes.outputs.android == 'true' }}
      ios: ${{ needs.changes.outputs.ios == 'true' }}
    secrets: inherit
    permissions:
      contents: write
      actions: read
